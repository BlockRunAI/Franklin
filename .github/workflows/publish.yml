name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    if: ${{ !startsWith(github.event.release.tag_name, 'desktop-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify package
        run: npm pack --dry-run

      - name: Check if version already published
        id: check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ ${PKG_NAME}@${PKG_VERSION} already published, skipping"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # npm trusted publishing (OIDC) with staged publishing. The package's
      # Trusted Publisher on npmjs.com (BlockRunAI/Franklin + publish.yml) is
      # allowed to *stage* only, never to publish. This job uploads the version
      # in a staged state that nobody can install; it goes live only when a
      # maintainer runs `npm stage approve <stage-id>` (or approves on
      # npmjs.com), which requires 2FA. A compromised workflow or a stolen
      # release permission therefore cannot ship a Franklin build to users.
      # No long-lived npm token is used: npm exchanges the job's id-token.
      - name: Upgrade npm for staged trusted publishing
        run: npm install -g npm@^11.20.0
      - name: Stage for publishing
        if: steps.check.outputs.already_published != 'true'
        run: |
          npm stage publish --provenance --access public
          {
            echo "### Staged, not yet live"
            echo ""
            echo "Approve with 2FA to publish:"
            echo ""
            echo '```'
            echo "npx -y npm@11 stage list @blockrun/franklin"
            echo "npx -y npm@11 stage approve <stage-id>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
