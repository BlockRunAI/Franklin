name: Desktop CI

on:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/agent/**"
      - "src/serve/**"
      - "src/tools/**"
      - "test/serve-security.local.mjs"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: apps/desktop/release/*.dmg
            name: macOS
          - os: windows-latest
            script: dist:win
            artifact: apps/desktop/release/*.exe
            name: Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the pinned monorepo dependency graph
        run: npm ci

      - name: Build Franklin runtime
        run: npm run build

      - name: Check Desktop
        run: |
          npm run typecheck --workspace @blockrun/franklin-desktop
          npm run lint --workspace @blockrun/franklin-desktop
          npm test --workspace @blockrun/franklin-desktop

      - name: Build unsigned test installer
        run: npm run ${{ matrix.script }} --workspace @blockrun/franklin-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: franklin-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: franklin-desktop-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          for file in release/*; do
            normalized="${file// /.}"
            if [[ "$file" != "$normalized" ]]; then mv "$file" "$normalized"; fi
          done
          sha256sum release/* | sed 's#  release/#  #' > release/SHA256SUMS.txt

      - name: Prepare release metadata
        id: release-meta
        shell: bash
        run: echo "name=Franklin Desktop ${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"

      - name: Publish Desktop prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release-meta.outputs.name }}
          prerelease: true
          body: |
            Franklin Desktop beta for macOS Apple Silicon and Windows x64.

            These beta installers are currently unsigned. On first launch, your operating system may ask you to confirm that you want to open the app.
          files: release/*
