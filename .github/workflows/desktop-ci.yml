name: Desktop CI

on:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/agent/**"
      - "src/serve/**"
      - "src/tools/**"
      - "src/skills/**"
      - "test/skills*.mjs"
      - "test/fixtures/**"
      - "test/serve-security.local.mjs"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
            name: macOS
          - os: windows-latest
            script: dist:win
            artifact: |
              apps/desktop/release/*.exe
              apps/desktop/release/latest*.yml
              apps/desktop/release/*.blockmap
            name: Windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify Desktop tag matches its package version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: node -e "const v=require('./apps/desktop/package.json').version; if(process.env.GITHUB_REF_NAME !== 'desktop-v'+v) throw new Error('Desktop tag/version mismatch')"

      - name: Install the pinned monorepo dependency graph
        run: npm ci

      - name: Build Franklin runtime
        run: npm run build

      - name: Check skills and permission boundaries
        run: node --test test/skills.local.mjs test/skills-management.local.mjs test/serve-security.local.mjs

      - name: Check Desktop
        run: |
          npm run typecheck --workspace @blockrun/franklin-desktop
          npm run lint --workspace @blockrun/franklin-desktop
          npm test --workspace @blockrun/franklin-desktop

      - name: Build unsigned test installer
        if: matrix.name != 'macOS' || !startsWith(github.ref, 'refs/tags/desktop-v')
        run: npm run ${{ matrix.script }} --workspace @blockrun/franklin-desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build signed and notarized macOS release
        if: matrix.name == 'macOS' && startsWith(github.ref, 'refs/tags/desktop-v')
        run: npm run dist:mac --workspace @blockrun/franklin-desktop
        env:
          FRANKLIN_SIGNED_RELEASE: "1"
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify in-app update metadata and payload checksums
        run: node apps/desktop/scripts/verify-update-artifacts.mjs

      - name: Verify macOS release signature and notarization
        if: matrix.name == 'macOS' && startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          codesign --verify --deep --strict apps/desktop/release/mac-arm64/Franklin.app
          xcrun stapler validate apps/desktop/release/mac-arm64/Franklin.app

      - name: Verify packaged runtime outside the checkout
        run: node apps/desktop/test/packaged-runtime.e2e.mjs

      - name: Verify real silent Windows upgrade in an isolated installation
        if: matrix.name == 'Windows'
        run: node apps/desktop/test/in-place-update.windows.mjs

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: franklin-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: franklin-desktop-*
          path: release
          merge-multiple: true

      - name: Verify both installers are present
        shell: bash
        run: |
          shopt -s nullglob
          dmg=(release/*.dmg)
          exe=(release/*.exe)
          zip=(release/*.zip)
          if (( ${#dmg[@]} != 1 || ${#exe[@]} != 1 || ${#zip[@]} != 1 )) || [[ ! -f release/latest.yml || ! -f release/latest-mac.yml ]]; then
            echo "::error::expected exactly one .dmg and one .exe, got ${#dmg[@]} dmg / ${#exe[@]} exe"
            ls -la release/
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: |
          sha256sum release/* | sed 's#  release/#  #' > release/SHA256SUMS.txt

      - name: Prepare release metadata
        id: release-meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          echo "name=Franklin Desktop $version" >> "$GITHUB_OUTPUT"
          notes="apps/desktop/release-notes/${version}.md"
          if [[ -f "$notes" ]]; then
            echo "using $notes"
            cp "$notes" release-body.md
          else
            echo "no $notes, falling back to the generic blurb"
            cat > release-body.md <<'EOF'
          Franklin Desktop beta for macOS Apple Silicon and Windows x64.

          These beta installers are currently unsigned. On first launch, your operating system may ask you to confirm that you want to open the app.
          EOF
          fi

      - name: Publish Desktop prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release-meta.outputs.name }}
          prerelease: true
          body_path: release-body.md
          files: release/*
